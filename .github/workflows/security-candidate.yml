name: Candidate security evidence
on:
  workflow_call:
    inputs:
      candidate:
        required: true
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          persist-credentials: false
      - name: Get scan policy from the pull request base or authorized release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.candidate }}
          path: policy
          persist-credentials: false
          sparse-checkout: scripts/security-candidate.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Install pinned secret scanner
        shell: bash
        run: |
          set -eu
          tools="$(mktemp -d "$RUNNER_TEMP/security-tools.XXXXXX")"
          cd "$tools"
          curl --fail --silent --show-error --location --max-time 60 --output release.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  release.tar.gz' | sha256sum --check
          tar -xzf release.tar.gz gitleaks
          echo "$tools" >> "$GITHUB_PATH"
      - name: Check commit and record redacted evidence
        if: ${{ !cancelled() }}
        env:
          CANDIDATE: ${{ inputs.candidate }}
        working-directory: candidate
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -f ../policy/scripts/security-candidate.py ]]; then
            echo 'Security evidence incomplete. The trusted scan policy is unavailable. Owner: meteor-desktop maintainers.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 -I ../policy/scripts/security-candidate.py "$CANDIDATE" | tee -a "$GITHUB_STEP_SUMMARY"
